<!DOCTYPE html>
<html translate="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Webbrowser Jump'n'Run game developed using HTML5, CSS3, and JavaScript."
    />
    <meta
      name="keywords"
      content="Webbrowser Game, Jump'n'Run, HTML5, CSS3, JavaScript, Game Development"
    />
    <meta name="author" content="K. Aksenov - Software Developer" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/web-app/icon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./assets/web-app/icon-32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/web-app/icon-192.png"
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="assets/web-app/manifest.json" />
    <link rel="stylesheet" href="./style/style.css" />

    <script src="./js/global.js"></script>
    <script src="./models/audio-class.js"></script>
    <script src="./models/collision-handler.class.js"></script>
    <script src="./models/object-drawable.class.js"></script>
    <script src="./models/object-movable.class.js"></script>
    <script src="./models/object-throwable.class.js"></script>
    <script src="./models/object-pickable.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/map-background.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/enemy-chicken.class.js"></script>
    <script src="./models/enemy-chick.class.js"></script>
    <script src="./models/enemy-chicken_counterStrike_.class.js"></script>
    <script src="./models/enemy-endboss.class.js"></script>
    <script src="./models/map-cloud.class.js"></script>
    <script src="./models/map-bottle.class.js"></script>
    <script src="./models/map-coin.class.js"></script>
    <script src="./models/status-bar-character.class.js"></script>
    <script src="./models/status-bar-boss.class.js"></script>
    <script src="./models/status-bar-coin.class.js"></script>
    <script src="./models/status-bar-bottle.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./models/static.class.js"></script>
    <script src="./js/display-handler.js"></script>
    <script src="./js/fullscreen.js"></script>
    <script src="./js/game.js"></script>
    <script src="./js/preloader.js"></script>
    <script src="./js/script.js"></script>
    <script src="./js/includeHTML.js"></script>

    <title>El POLLO LOCO</title>
  </head>

  <body onload="prepareTheGamingExperience()">
    <header>
      <h1 class="customH1 disableTextSelection" id="customH1">El POLLO LOCO</h1>
    </header>

    <main class="mainLayerAsRelative" id="mainLayerAsRelative">
      <canvas id="canvas" class="canvas" style="display: block"></canvas>

      <img
        class="homeLayer"
        id="homeLayer"
        src="./assets/img/9_intro_outro_screens/start/startscreen_1.png"
        alt="Home layer."
      />

      <div class="w3_include" id="w3_include"></div>

      <div class="hotMenu" id="hotMenu">
        <input
          type="range"
          id="volumeSlider"
          min="0"
          max="100"
          value="0"
          step="1"
        />

        <div class="menuControlsWrapper">
          <div class="menuSoundBox" id="menuSoundBox">
            <button
              class="openMenuBtn disableTextSelection"
              id="openMenuBtn"
              tabindex="-1"
            >
              Menu
            </button>
            <img
              class="muteButton"
              id="muteButton"
              src="./assets/img/10_menu/volume_up.svg"
              alt="Mute Button."
              style="display: none"
            />
          </div>

          <button
            class="fullscreenBtn disableTextSelection"
            onclick="toggleFullscreen(event)"
            tabindex="-1"
            title="Toggle Fullscreen"
          >
            <img
              src="./assets/vector/fullscreen-api.svg"
              alt="Fullscreen"
              draggable="false"
            />
          </button>
        </div>
      </div>

      <div
        class="menuPop disableTextSelection"
        id="menuPop"
        style="display: none"
      >
        <h3 class="menuHeader disableTextSelection" id="menuHeader">PAUSE</h3>

        <div class="menuBtnContainer">
          <button class="disableTextSelection" onclick="initGame()">
            NEW GAME
          </button>
          <button
            class="disableTextSelection"
            onclick="toggleFullscreen(event)"
          >
            Fullscreen
          </button>
          <button
            class="disableTextSelection"
            onclick="loadPage('../templates/story.html')"
          >
            STORY
          </button>
          <button
            class="disableTextSelection"
            onclick="loadPage('../templates/settings.html')"
          >
            SETTINGS
          </button>
          <button
            class="returnToHomeBtn disableTextSelection"
            id="returnToHomeBtn"
            onclick="returnToHome()"
          >
            RETURN TO HOME
          </button>
        </div>

        <div class="menuFooter" id="menuFooter">
          <p
            class="disableTextSelection"
            onclick="loadPage('../templates/imprint.html')"
          >
            Imprint
          </p>
        </div>
      </div>

      <div class="mobileControlHub disableTextSelection" id="mobileControlHub">
        <div class="panelWrapper disableTextSelection" id="panelWrapper">
          <button class="mobileBtn disableTextSelection" id="leftButton">
            <img
              src="./assets/vector/arrows/keyboard-arrow-left.svg"
              alt="Left"
              class="btnIcon"
              draggable="false"
            />
          </button>
          <button class="mobileBtn disableTextSelection" id="rightButton">
            <img
              src="./assets/vector/arrows/keyboard-arrow-right.svg"
              alt="Right"
              class="btnIcon"
              draggable="false"
            />
          </button>
        </div>

        <div class="panelWrapper disableTextSelection" id="panelWrapper">
          <button class="mobileBtn disableTextSelection" id="jumpButton">
            <img
              src="./assets/vector/arrows/keyboard arrow up.svg"
              alt="Jump"
              class="btnIcon"
              draggable="false"
            />
          </button>
          <button class="mobileBtn disableTextSelection" id="throwButton">
            <img
              src="./assets/vector/arrows/bolt.svg"
              alt="Throw"
              class="btnIcon"
              draggable="false"
            />
          </button>
          <button class="mobileBtn disableTextSelection" id="healButton">
            <img
              src="./assets/vector/arrows/heart-plus.svg"
              alt="Heal"
              class="btnIcon"
              draggable="false"
            />
          </button>
        </div>
      </div>

      <div class="desktopPrompts" id="desktopPrompts">
        <button
          class="openMenuBtn disableTextSelection"
          id="healPromptDesktop"
          style="display: none"
        >
          Drücke <strong>H</strong> zum Heilen
        </button>
        <button
          class="openMenuBtn disableTextSelection"
          id="throwPromptDesktop"
          style="display: none"
        >
          Drücke <strong>D</strong> zum Werfen
        </button>
      </div>

      <div class="rotateLayer" id="rotateLayer">
        <img
          class="ratationImage"
          id="ratationImage"
          src="./assets/img/10_menu/screen_rotation.svg"
          alt="Rotate layer image."
        />
        <p class="disableTextSelection">Turn your Phone</p>
      </div>

      <img
        class="apertureGameOver"
        id="apertureGameOver"
        src="./assets/img/9_intro_outro_screens/game_over/youLose.png"
        alt="Game Over screen."
      />
      <img
        class="apertureGameWin"
        id="apertureGameWin"
        src="./assets/img/9_intro_outro_screens/game_over/youWin.png"
        alt="Game Winner screen."
      />
    </main>

    <footer>
      <div class="socialLinks">
        <img
          src="./assets/social/guard.svg"
          alt="Imprint"
          class="socialIcon"
          onclick="loadPage('../templates/imprint.html')"
          rel="noopener noreferrer"
        />

        <img
          src="./assets/social/email.svg"
          alt="Email"
          class="socialIcon"
          onclick="window.location.href='mailto:konstantin.aksenov@dev2k.org'"
          rel="noopener noreferrer"
        />

        <img
          src="./assets/social/youtube.svg"
          alt="YouTube"
          class="socialIcon"
          onclick="window.open('https://www.youtube.com/@kav87', '_blank')"
          rel="noopener noreferrer"
        />

        <img
          src="./assets/social/linkedin.svg"
          alt="LinkedIn"
          class="socialIcon"
          onclick="window.open('https://www.linkedin.com/in/konstantin-aksenov-802b88190/', '_blank')"
          rel="noopener noreferrer"
        />

        <img
          src="./assets/social/github.svg"
          alt="GitHub"
          class="socialIcon"
          onclick="window.open('https://github.com/KosMaster87/', '_blank')"
          rel="noopener noreferrer"
        />
      </div>
    </footer>

    <div class="loadingSpinnerLayer" id="loadingSpinnerLayer">
      <img
        class="loadingSpinnerImg"
        id="loadingSpinnerImg"
        src="./assets/img/6_salsa_bottle/bottle_rotation/1_bottle_rotation.png"
        alt="You are Welkom - Experience is being prepared."
      />
      <p
        class="loadingSpinnerPara disableTextSelection"
        id="loadingSpinnerPara"
      >
        Your gaming experience is being prepared. <br />
        There are approximately 20 MB to download.
      </p>
    </div>
  </body>
</html>
